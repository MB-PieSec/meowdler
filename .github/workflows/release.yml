# Meowdler release pipeline.
#
# Triggered by pushing a semver tag (v0.2.0 style). Every OS packages its own
# installer and the combined result is attached to a GitHub release.
#
# The committed `resources/yt-dlp` is a Linux binary (handy for desktop dev);
# the CI replaces it with the matching per-OS build so every platform's
# package ships a working engine. ffmpeg is staged the same way, since best-
# quality video merging needs it (without it the app reports "merging
# unavailable" and only single-format downloads work).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest*.yml
              dist/*.blockmap
          - os: macos-latest
            artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/latest*.yml
              dist/*.blockmap
          - os: windows-latest
            artifacts: |
              dist/*.exe
              dist/latest*.yml
              dist/*.blockmap

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron + electron-builder download big caches per runner; keep them.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      # -- platform-matching engine binaries -------------------------------

      - name: Stage yt-dlp + ffmpeg (linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o resources/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x resources/yt-dlp
          sudo apt-get update -q
          sudo apt-get install -y -qq ffmpeg
          bash scripts/fetch-ffmpeg.sh

      - name: Stage yt-dlp + ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o resources/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x resources/yt-dlp
          brew install ffmpeg
          bash scripts/fetch-ffmpeg.sh

      - name: Stage yt-dlp + ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile resources/yt-dlp
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination resources/ffmpeg
          Remove-Item ffmpeg.zip, ffmpeg-tmp -Recurse -Force

      # -- gates + build ----------------------------------------------------

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Meowdler-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
