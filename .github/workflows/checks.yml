# Fast checks on every main push and pull request: the four local gates plus
# the unit test suite (Vitest). Release lanes run the same tests before
# packaging, so a tag never ships an untested build.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck + lint + format + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + lint + format
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
      - name: Tests
        run: npm test
